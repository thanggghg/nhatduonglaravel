<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0b7f42;--deep:#062d1c;--gold:#fbb116;--line:#d8e5dc;--muted:#607269;--mist:#f4f8f4}*{box-sizing:border-box}body{margin:0;color:var(--deep);background:#fff;font-family:Inter,sans-serif}.hero{min-height:900px;padding:38px 6vw;background:linear-gradient(180deg,rgba(6,45,28,.1),#fff 68%),url('https://web.nhaxenhatduong.com/storage/banners/9wryMGjkbnqDPbsOw7Hmbu1lj2JSFFj7hHSLsj5k.jpg') top center/100% 480px no-repeat}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800}.brand img{width:40px;height:40px;object-fit:contain;filter:brightness(0) invert(1)}.content{max-width:1040px;margin:110px auto 0;text-align:center}.content .eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em}.content h1{max-width:760px;margin:14px auto 12px;color:#fff;font:800 clamp(42px,5vw,68px)/1.04 'Be Vietnam Pro';letter-spacing:-.055em}.content>p{color:#dcebe1}.panel{margin-top:42px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 65px rgba(6,45,28,.18);text-align:left}.question{margin-bottom:16px;font:700 16px 'Be Vietnam Pro'}.route{display:grid;grid-template-columns:1fr 50px 1fr;gap:10px}.location{padding:16px;border:1px solid var(--line);border-radius:13px}.location span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.location strong{display:block;margin-top:5px;font-size:16px}.swap{color:var(--green);background:#edf8f0;border:1px solid #cfe5d5;border-radius:13px;font-size:20px}.options{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{min-height:44px;padding:0 14px;color:#486055;background:#f6f9f6;border:1px solid var(--line);border-radius:99px;font:700 12px Inter}.chip.active{color:var(--green);background:#eaf6ed;border-color:#9ecaaa}.chip.return{border-style:dashed}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.footer p{margin:0;color:var(--muted);font-size:12px}.search{min-height:52px;padding:0 28px;color:#fff;background:var(--green);border:0;border-radius:12px;font:800 14px Inter}.caption{max-width:1040px;margin:18px auto;color:var(--muted);font-size:12px;text-align:left}.caption b{color:var(--green)}
@media(max-width:700px){.hero{padding:24px 14px;background-size:auto 430px}.content{margin-top:68px;text-align:left}.content h1{font-size:36px}.panel{margin-top:30px;padding:16px;border-radius:18px}.route{grid-template-columns:1fr}.swap{width:46px;height:44px;justify-self:center;transform:rotate(90deg)}.options{display:grid;grid-template-columns:1fr 1fr}.chip{padding:0 10px}.footer{align-items:stretch;flex-direction:column}.search{width:100%}}
</style></head>
<body><main class="hero"><div class="brand"><img src="../public/Nhat-Duong-Logo-1-768x543.png" alt=""><span>Nhật Dương</span></div><section class="content"><div class="eyebrow">TÌM CHUYẾN NHANH</div><h1>Hôm nay bạn muốn đi đâu?</h1><p>Chọn tuyến trước, bổ sung ngày về khi thực sự cần.</p><form class="panel"><div class="question">Hành trình</div><div class="route"><label class="location"><span>Từ</span><strong>TP. Hồ Chí Minh</strong></label><button class="swap" type="button">⇄</button><label class="location"><span>Đến</span><strong>Nha Trang</strong></label></div><div class="options"><button class="chip active" type="button">Hôm nay · 27/08</button><button class="chip" type="button">Ngày mai · 28/08</button><button class="chip return" type="button">＋ Thêm ngày về</button><button class="chip" type="button">1 hành khách</button></div><div class="footer"><p>Giá và số chỗ được cập nhật trực tiếp.</p><button class="search" type="submit">Tìm chuyến →</button></div></form></section><p class="caption"><b>Hướng C</b> · Progressive disclosure, ưu tiên mobile và lựa chọn nhanh.</p></main></body></html>
