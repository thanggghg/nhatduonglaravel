<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0b7f42;--deep:#062d1c;--gold:#fbb116;--line:#d8e5dc;--muted:#66786f;--mist:#f4f8f4}*{box-sizing:border-box}body{margin:0;color:var(--deep);background:var(--mist);font-family:Inter,sans-serif}.stage{min-height:900px;padding:42px 6vw;background:linear-gradient(120deg,rgba(6,45,28,.92),rgba(6,45,28,.62)),url('https://web.nhaxenhatduong.com/storage/banners/9wryMGjkbnqDPbsOw7Hmbu1lj2JSFFj7hHSLsj5k.jpg') center/cover}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800}.brand img{width:38px;height:38px;object-fit:contain;filter:brightness(0) invert(1)}.hero{max-width:1180px;margin:105px auto 0}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em}.hero h1{max-width:760px;margin:14px 0 12px;color:#fff;font:800 clamp(42px,5vw,68px)/1.06 'Be Vietnam Pro';letter-spacing:-.05em}.hero>p{color:#dcebe1;font-size:17px}.booking{margin-top:34px;padding:18px;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.booking-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.booking-top strong{font:700 15px 'Be Vietnam Pro'}.live{padding:7px 10px;color:var(--green);background:#eaf6ed;border-radius:99px;font-size:10px;font-weight:800}.bar{display:grid;grid-template-columns:1fr 46px 1fr 1.05fr .7fr auto;gap:8px;align-items:stretch}.field{display:grid;gap:5px;padding:10px 13px;border:1px solid var(--line);border-radius:11px}.field span{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.field strong{font-size:14px}.field small{color:var(--green);font-size:11px;font-weight:700}.swap{display:grid;place-items:center;color:var(--green);background:#eef8f0;border:1px solid #cfe5d5;border-radius:11px;font-size:21px}.search{padding:0 24px;color:#fff;background:var(--green);border:0;border-radius:11px;font:800 14px Inter}.trust{display:flex;gap:22px;margin:15px 4px 0;color:#52675d;font-size:11px;font-weight:700}.trust span:before{content:'✓';margin-right:6px;color:var(--green)}.caption{max-width:1180px;margin:22px auto 0;color:#dcebe1;font-size:12px}.caption b{color:var(--gold)}
@media(max-width:700px){.stage{min-height:900px;padding:24px 14px}.hero{margin-top:58px}.hero h1{font-size:35px}.booking{padding:14px}.booking-top{align-items:flex-start;flex-direction:column;gap:8px}.bar{grid-template-columns:1fr}.swap{width:46px;height:44px;justify-self:center;transform:rotate(90deg)}.field{min-height:64px}.search{min-height:52px}.trust{flex-wrap:wrap;gap:8px 14px}}
</style></head>
<body><main class="stage"><div class="brand"><img src="../public/Nhat-Duong-Logo-1-768x543.png" alt=""><span>Nhật Dương</span></div><section class="hero"><div class="eyebrow">ĐẶT VÉ TRỰC TUYẾN</div><h1>Sài Gòn ⇔ Nha Trang</h1><p>Chọn hành trình và xem chuyến phù hợp trong một bước.</p><form class="booking"><div class="booking-top"><strong>Bạn muốn đi đâu?</strong><span class="live">● Dữ liệu trực tiếp</span></div><div class="bar"><label class="field"><span>Điểm đi</span><strong>TP. Hồ Chí Minh</strong></label><button class="swap" type="button" aria-label="Đổi chiều">⇄</button><label class="field"><span>Điểm đến</span><strong>Nha Trang</strong></label><label class="field"><span>Ngày đi</span><strong>27/08/2026</strong><small>+ Thêm ngày về</small></label><label class="field"><span>Hành khách</span><strong>1 khách</strong></label><button class="search" type="submit">Tìm chuyến →</button></div><div class="trust"><span>Giá cập nhật trực tiếp</span><span>Chọn phòng ở bước tiếp theo</span><span>Hỗ trợ 24/7</span></div></form><p class="caption"><b>Hướng A</b> · Command bar tối giản, không hỏi một chiều hay khứ hồi trước.</p></section></main></body></html>
